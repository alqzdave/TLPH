<style>
/* Modern Messenger Inquiry Tab Styles */
.inquiry-messenger {
    display: flex;
    flex-direction: column;
    height: 320px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    overflow: hidden;
    border: 1px solid #e2e8f0;
}
.inquiry-messenger-body {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 0.7rem 0.5rem 0.7rem;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    background: #f8fafc;
}
.inquiry-msg {
    max-width: 80%;
    padding: 0.6rem 1rem;
    border-radius: 16px;
    font-size: 0.97rem;
    background: #fff;
    color: #1e293b;
    align-self: flex-start;
    box-shadow: 0 1.5px 6px 0 rgba(16, 42, 67, 0.06);
    position: relative;
    word-break: break-word;
    margin-bottom: 0.2rem;
}
.inquiry-msg.me {
    background: linear-gradient(90deg, #2563eb 80%, #60a5fa 100%);
    color: #fff;
    align-self: flex-end;
}
.inquiry-msg .msg-img {
    max-width: 140px;
    max-height: 140px;
    border-radius: 10px;
    margin-top: 0.3rem;
    display: block;
    box-shadow: 0 2px 8px 0 rgba(34,211,238,0.13);
    cursor: pointer;
}
.inquiry-msg .msg-time {
    display: block;
    font-size: 0.7rem;
    color: #64748b;
    margin-top: 0.2rem;
    text-align: right;
}
.inquiry-messenger-footer {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.6rem 0.7rem;
    border-top: 1px solid #e2e8f0;
    background: #fff;
}
.inquiry-messenger-footer input[type="text"] {
    flex: 1;
    border-radius: 8px;
    border: 1.5px solid #cbd5e1;
    padding: 0.4rem 0.8rem;
    font-size: 1rem;
}
.inquiry-messenger-footer .footer-btn {
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.4rem 0.7rem;
    font-weight: 700;
    font-size: 1.1rem;
    transition: background 0.18s;
    display: flex; align-items: center; justify-content: center;
}
.inquiry-messenger-footer .footer-btn:hover { background: #1d4ed8; }
.inquiry-messenger-footer input[type="file"] { display: none; }
.inquiry-link-preview {
    display: flex; flex-direction: column; width: 100%; max-width: 220px;
    margin-top: 8px; border-radius: 10px; overflow: hidden;
    background: #f8fafc; border: 1px solid #cbd5e1; text-decoration: none; 
    color: inherit; transition: all 0.2s;
    font-size: 0.85rem;
}
.inquiry-link-preview img { width: 100%; height: 80px; object-fit: cover; border-radius: 0; margin: 0; border: none; }
.inquiry-link-preview-content { padding: 8px; }
.inquiry-link-preview-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 2px; }
.inquiry-link-preview-domain { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; opacity: 0.6; letter-spacing: 0.5px; }
#inquiryLightbox { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 3000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
#inquiryLightbox.show { opacity: 1; pointer-events: auto; }
#inquiryLightbox img { max-width: 90%; max-height: 90%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
#inquiryLightbox .lightbox-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
/* Floating Notification Modal Tabs */
.notif-modal-tabs {
    display: flex;
    border-bottom: 1.5px solid #2563eb22;
    background: #2563eb;
    color: #fff;
    height: 38px;
    align-items: stretch;
    position: relative;
    z-index: 1;
}
.notif-modal-tab-btn {
    flex: 1 1 0%;
    padding: 0 0.5rem;
    font-weight: 600;
    font-size: 1rem;
    letter-spacing: 0.01em;
    background: transparent;
    border: none;
    outline: none;
    cursor: pointer;
    transition: color 0.18s;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
}
.notif-modal-tab-btn.active {
    color: #2563eb;
}
.notif-modal-tab-btn .tab-bg {
    display: none;
}
.notif-modal-tab-btn.active .tab-bg {
    display: block;
    position: absolute;
    left: 0; right: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, #fff 60%, #e0eaff 100%);
    border-radius: 0 0 12px 12px;
    z-index: -1;
    animation: tab-bg-fade-in 0.32s cubic-bezier(.68,-0.55,.27,1.55);
}
@keyframes tab-bg-fade-in {
    0% { opacity: 0; transform: translateY(-10px); }
    100% { opacity: 1; transform: translateY(0); }
}
.floating-notification-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 2000;
    background: rgba(255,255,255,0.18);
    color: #0e7490;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 24px 0 rgba(16, 185, 129, 0.18), 0 1.5px 8px 0 rgba(34,211,238,0.10);
    transition: box-shadow 0.2s, transform 0.18s, background 0.2s;
    cursor: pointer;
    backdrop-filter: blur(12px) saturate(180%);
    border: 1.5px solid rgba(255,255,255,0.35);
    animation: notif-float-in 0.5s cubic-bezier(.68,-0.55,.27,1.55);
    overflow: hidden;
}
.floating-notification-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(34,211,238,0.10) 100%);
    pointer-events: none;
    z-index: 1;
}
.floating-notification-btn:hover {
    background: rgba(255,255,255,0.28);
    box-shadow: 0 10px 32px 0 rgba(16, 185, 129, 0.28), 0 2px 12px 0 rgba(34,211,238,0.18);
    transform: scale(1.08) translateY(-2px);
}
.floating-notification-btn:active {
    transform: scale(0.97);
}
.floating-notification-btn i.fa-bell {
    font-size: 1.35rem;
    filter: drop-shadow(0 1px 3px #0e749055);
    transition: color 0.2s;
    z-index: 2;
}
.floating-notification-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    background: linear-gradient(90deg, #f43f5e 0%, #f59e42 100%);
    color: #fff;
    font-size: 10px;
    font-weight: bold;
    border-radius: 9999px;
    padding: 1.5px 6px;
    border: 1.5px solid #fff;
    box-shadow: 0 1px 4px rgba(244,63,94,0.13);
    letter-spacing: 0.3px;
    animation: notif-badge-pop 0.6s cubic-bezier(.68,-0.55,.27,1.55);
    z-index: 3;
}
@keyframes notif-float-in {
    0% { opacity: 0; transform: scale(0.7) translateY(60px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes notif-badge-pop {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}
@media (max-width: 600px) {
    .floating-notification-btn { right: 10px; bottom: 10px; width: 38px; height: 38px; }
    .floating-notification-badge { top: 2.5px; right: 2.5px; font-size: 8.5px; padding: 1px 4px; }
}
</style>


<div class="floating-notification-btn group" title="Notifications" onclick="openNotificationModal()">
    <i class="fa-solid fa-bell text-xl group-hover:text-yellow-300 transition" id="userNotifBell"></i>
    <span class="floating-notification-badge" id="userNotifBadge" style="display:none"></span>
</div>

<!-- Notification Modal -->
<!-- Notification Modal (Chat Bubble Style) -->
<div id="notificationModal" class="fixed z-[3000] hidden" style="bottom: 76px; right: 24px;">
    <div class="relative">
        <!-- Arrow -->
        <div style="position:absolute;bottom:-12px;right:18px;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:12px solid #2563eb;z-index:2;"></div>
        <div class="bg-white/80 backdrop-blur-md rounded-2xl shadow-2xl w-80 max-w-[90vw] p-0 border border-blue-200 animate-fade-in overflow-hidden" style="box-shadow:0 8px 32px 0 rgba(16, 185, 129, 0.18),0 1.5px 8px 0 rgba(34,211,238,0.10);">
            <!-- Tabs -->
            <div class="notif-modal-tabs">
                <button id="notifTabBtn" onclick="showNotifTab()" class="notif-modal-tab-btn active">
                    <span>Notification</span>
                    <span class="tab-bg"></span>
                </button>
                <button id="msgTabBtn" onclick="showMsgTab()" class="notif-modal-tab-btn">
                    <span>Inquiry</span>
                    <span class="tab-bg"></span>
                </button>
                <button onclick="closeNotificationModal()" class="ml-auto text-white/80 hover:text-white text-lg font-bold focus:outline-none px-3" title="Close" style="background:transparent;border:none;outline:none;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <!-- Tab Content -->
            <div id="notifTabContent">
                <div class="max-h-72 overflow-y-auto py-2 bg-white/70" id="userNotificationList">
                    <div class="text-slate-400 text-xs px-4 py-2">Loading notifications...</div>
                </div>
            </div>
            <div id="msgTabContent" style="display:none;">
                <div class="inquiry-messenger">
                    <div class="inquiry-messenger-body" id="userMessageList"></div>
                    <form id="userMessageForm" class="inquiry-messenger-footer" onsubmit="sendUserMessage(event)">
                        <label class="footer-btn" for="userPhotoInput" title="Attach Photo"><i class="fa fa-paperclip"></i></label>
                        <input type="file" id="userPhotoInput" accept="image/*" onchange="sendUserPhoto(event)">
                        <label class="footer-btn" for="userCameraInput" title="Take Photo"><i class="fa fa-camera"></i></label>
                        <input type="file" id="userCameraInput" accept="image/*" capture="environment" onchange="sendUserPhoto(event)">
                        <input type="text" id="userMessageInput" placeholder="Type a message..." autocomplete="off" required />
                        <button type="submit" class="footer-btn" title="Send"><i class="fa fa-paper-plane"></i></button>
                    </form>
                </div>
                <div id="inquiryLightbox" onclick="closeInquiryLightbox()">
                    <span class="lightbox-close" onclick="closeInquiryLightbox()">&times;</span>
                    <img id="inquiryLightboxImg" src="" alt="Preview" onclick="event.stopPropagation()">
                </div>
            </div>
        <script>
                // Tab switching logic
                function showNotifTab() {
                    document.getElementById('notifTabContent').style.display = '';
                    document.getElementById('msgTabContent').style.display = 'none';
                    document.getElementById('notifTabBtn').classList.add('active');
                    document.getElementById('msgTabBtn').classList.remove('active');
                }
                function showMsgTab() {
                    document.getElementById('notifTabContent').style.display = 'none';
                    document.getElementById('msgTabContent').style.display = '';
                    document.getElementById('notifTabBtn').classList.remove('active');
                    document.getElementById('msgTabBtn').classList.add('active');
                }
                // --- Inquiry Messenger: Backend Integration ---
                let userId = window.currentUserId || (window.user && window.user.id) || '';
                let userName = window.currentUserName || (window.user && window.user.name) || '';
                let userPhoto = window.currentUserPhoto || (window.user && window.user.photo) || '';
                function fetchInquiryMessages() {
                    fetch(`/api/inquiries/messages/${userId}`, { credentials: 'same-origin' })
                        .then(r => r.json())
                        .then(res => {
                            if (res.success) renderInquiryMessages(res.messages);
                        });
                }
                function renderInquiryMessages(messages) {
                    const list = document.getElementById('userMessageList');
                    list.innerHTML = (messages||[]).map(m => {
                        let isMe = m.user_id === userId;
                        let msgContent = formatInquiryText(m.message||'');
                        if (m.file_url) msgContent += `<img src="${m.file_url}" class="msg-img" alt="photo" onclick="openInquiryLightbox('${m.file_url}')">`;
                        let extraClass = m.file_url && !(m.message||'').trim() ? ' image-only' : '';
                        let time = m.timestamp ? new Date(m.timestamp.seconds ? m.timestamp.seconds*1000 : m.timestamp).toLocaleString() : '';
                        return `<div class="inquiry-msg${isMe?' me':''}${extraClass}">${msgContent}<span class="msg-time">${time}</span></div>`;
                    }).join('');
                    setTimeout(()=>{ list.scrollTop = list.scrollHeight; }, 50);
                }
                function sendUserMessage(e) {
                    e.preventDefault();
                    const input = document.getElementById('userMessageInput');
                    const msg = input.value.trim();
                    if (!msg) return;
                    const formData = new FormData();
                    formData.append('user_id', userId);
                    formData.append('user_name', userName);
                    formData.append('user_photo', userPhoto);
                    formData.append('message', msg);
                    fetch('/api/inquiries/send', {
                        method: 'POST',
                        body: formData,
                        credentials: 'same-origin'
                    }).then(r => r.json()).then(res => {
                        if (res.success) {
                            input.value = '';
                            fetchInquiryMessages();
                        }
                    });
                }
                function sendUserPhoto(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const formData = new FormData();
                    formData.append('user_id', userId);
                    formData.append('user_name', userName);
                    formData.append('user_photo', userPhoto);
                    formData.append('message', '');
                    formData.append('file', file);
                    fetch('/api/inquiries/send', {
                        method: 'POST',
                        body: formData,
                        credentials: 'same-origin'
                    }).then(r => r.json()).then(res => {
                        if (res.success) fetchInquiryMessages();
                    });
                }
                function formatInquiryText(text) {
                    if (!text) return '';
                    // Linkify URLs
                    return text.replace(/(https?:\/\/[^\s]+)/g, url => `<a href="${url}" target="_blank" class="inquiry-link">${url}</a>`);
                }
                function openInquiryLightbox(img) {
                    document.getElementById('inquiryLightboxImg').src = img;
                    document.getElementById('inquiryLightbox').classList.add('show');
                }
                function closeInquiryLightbox() {
                    document.getElementById('inquiryLightbox').classList.remove('show');
                }
                // Initial fetch
                document.addEventListener('DOMContentLoaded', fetchInquiryMessages);
                function formatInquiryText(text) {
                    if (!text) return '';
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    let previewHtml = '';
                    const match = text.match(urlRegex);
                    if (match && match.length > 0) {
                        const url = match[0];
                        let domain = '';
                        try { domain = new URL(url).hostname; } catch(e) { domain = 'website.com'; }
                        previewHtml = `
                            <a href="${url}" target="_blank" class="inquiry-link-preview">
                                <img src="https://images.unsplash.com/photo-1507238691740-187a5b1d37b8?auto=format&fit=crop&q=80&w=400&h=200" alt="Preview">
                                <div class="inquiry-link-preview-content">
                                    <div class="inquiry-link-preview-title">${domain} Page Info</div>
                                    <div class="inquiry-link-preview-domain">${domain}</div>
                                </div>
                            </a>
                        `;
                    }
                    const formattedText = text.replace(urlRegex, function(url) {
                        return `<a href="${url}" target="_blank" style="color:#2563eb;text-decoration:underline;">${url}</a>`;
                    });
                    return formattedText + previewHtml;
                }
                function sendUserMessage(e) {
                    e.preventDefault();
                    const input = document.getElementById('userMessageInput');
                    const msg = input.value.trim();
                    if (!msg) return;
                    inquiryMessages.push({me:true, text:msg, time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
                    input.value = '';
                    renderInquiryMessages();
                }
                function sendUserPhoto(e) {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = function(ev) {
                        inquiryMessages.push({me:true, img:ev.target.result, time: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})});
                        renderInquiryMessages();
                    };
                    reader.readAsDataURL(file);
                    e.target.value = '';
                }
                function openInquiryLightbox(imgSrc) {
                    const lightbox = document.getElementById('inquiryLightbox');
                    const img = document.getElementById('inquiryLightboxImg');
                    img.src = imgSrc;
                    lightbox.classList.add('show');
                }
                function closeInquiryLightbox() {
                    document.getElementById('inquiryLightbox').classList.remove('show');
                    setTimeout(() => { document.getElementById('inquiryLightboxImg').src = ""; }, 300);
                }
                // Initial render
                renderInquiryMessages();
        function timeAgoUser(dateStr) {
            const date = new Date(dateStr);
            const now = new Date();
            const seconds = Math.floor((now - date) / 1000);
            const hours = Math.floor(seconds / 3600);
            if (hours < 24) {
                return hours === 1 ? '1 hour ago' : `${hours} hours ago`;
            }
            const days = Math.floor(hours / 24);
            return days === 1 ? '1 day ago' : `${days} days ago`;
        }

        function renderUserNotificationItem(notif) {
            return `
                <div class="flex items-start gap-3 px-4 py-2 hover:bg-blue-50/80 cursor-pointer border-b border-blue-50 last:border-b-0">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-500">
                        <i class="fa-solid fa-bell"></i>
                    </div>
                    <div class="flex-grow min-w-0">
                        <div class="flex items-center gap-1">
                            <span class="font-semibold text-sm text-blue-900 truncate">${notif.title || notif.type || 'Notification'}</span>
                            <span class="ml-auto text-[10px] text-slate-400">${notif.post_date ? timeAgoUser(notif.post_date) : ''}</span>
                        </div>
                        <div class="text-xs text-slate-500 truncate">${notif.content || ''}</div>
                    </div>
                </div>
            `;
        }

        async function updateUserNotificationBadgeAndList() {
            const badge = document.getElementById('userNotifBadge');
            const bell = document.getElementById('userNotifBell');
            const listDiv = document.getElementById('userNotificationList');
            try {
                const res = await fetch('/api/notifications/list');
                const data = await res.json();
                if (!data.success) throw new Error(data.message || 'Failed to fetch notifications');
                const notifs = (data.notifications || []).filter(n => {
                    if (n.status !== 'posted') return false;
                    if (!(n.scope === 'all' || n.scope === 'user' || n.scope === 'end-user')) return false;
                    if (!n.post_date) return false;
                    const postDate = new Date(n.post_date);
                    const now = new Date();
                    const diffHrs = (now - postDate) / (1000 * 60 * 60);
                    return diffHrs <= 5;
                });
                if (notifs.length > 0) {
                    badge.textContent = notifs.length > 9 ? '9+' : notifs.length;
                    badge.style.display = '';
                    bell.classList.add('text-yellow-500', 'animate-bounce');
                    bell.classList.remove('text-slate-400');
                } else {
                    badge.textContent = '';
                    badge.style.display = 'none';
                    bell.classList.remove('text-yellow-500', 'animate-bounce');
                    bell.classList.add('text-slate-400');
                }
                if (listDiv) {
                    if (notifs.length === 0) {
                        listDiv.innerHTML = '<div class="text-slate-400 text-xs px-4 py-2">No notifications to display.</div>';
                    } else {
                        // Sort by post_date descending
                        notifs.sort((a, b) => new Date(b.post_date) - new Date(a.post_date));
                        listDiv.innerHTML = notifs.map(renderUserNotificationItem).join('');
                    }
                }
            } catch (e) {
                badge.textContent = '';
                badge.style.display = 'none';
                bell.classList.remove('text-yellow-500', 'animate-bounce');
                bell.classList.add('text-slate-400');
                if (listDiv) listDiv.innerHTML = '<div class="text-rose-500 text-xs px-4 py-2">Error loading notifications: ' + e.message + '</div>';
            }
        }
        document.addEventListener('DOMContentLoaded', updateUserNotificationBadgeAndList);
        setInterval(updateUserNotificationBadgeAndList, 2 * 60 * 1000);
        </script>
        </div>
    </div>
</div>
<script>
function openNotificationModal() {
    document.getElementById('notificationModal').classList.remove('hidden');
    setTimeout(() => {
        document.addEventListener('mousedown', clickOutsideModal, true);
    }, 10);
}
function closeNotificationModal() {
    document.getElementById('notificationModal').classList.add('hidden');
    document.removeEventListener('mousedown', clickOutsideModal, true);
}
function clickOutsideModal(e) {
    const modal = document.getElementById('notificationModal');
    if (modal && !modal.contains(e.target) && !e.target.closest('.floating-notification-btn')) {
        closeNotificationModal();
    }
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeNotificationModal();
});
</script>
<!-- End Floating Notification Icon and Modal -->
